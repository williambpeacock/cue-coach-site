<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cue Coach</title>
<style>
  :root {
    --bg: #1c1e22;
    --bg-soft: #24272c;
    --orange: #e8792e;
    --text: #f2f2f0;
    --text-dim: #9a9da2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    text-align: center;
    max-width: 640px;
  }
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--orange);
    box-shadow: 0 0 18px rgba(232, 121, 46, 0.6);
  }
  .brand {
    font-size: 1.1rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #cfd2d6;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 3.2rem);
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: 18px;
  }
  h1 span {
    color: var(--orange);
  }
  .tagline {
    font-size: 1.15rem;
    color: #c7cacd;
    font-style: italic;
    margin-bottom: 40px;
  }
  .badge {
    display: inline-block;
    padding: 10px 22px;
    border: 1px solid var(--orange);
    border-radius: 999px;
    color: var(--orange);
    font-size: 0.85rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 600;
  }
  footer {
    margin-top: 48px;
    font-size: 0.8rem;
    color: #6c6f73;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="logo.svg" alt="Cue Coach" height="40">
    </div>
    <h1>See every <span>stroke</span>.<br>Fix every flaw.</h1>
    <p class="tagline">"If you can't see it, you can't fix it."</p>
    <div class="badge">Coming Soon</div>
    <footer>&copy; 2026 Cue Coach</footer>
  </div>
</body>
</html>
